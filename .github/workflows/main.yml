# Windows-only workspace: ks-core is the no_std protocol/ABI crate, ks-driver is
# a WDM kernel driver, and the service/GUI/installer use Win32 APIs. There is no
# cross-platform build, so every job runs on a Windows runner.
#
# Two stages:
#   verify - the AGENTS.md checklist (fmt / check / test). No WDK needed.
#   build  - deployment images. ks-gui uses the gui-release profile because the
#            normal release profile is panic = "abort", which would break the
#            GUI's catch_unwind recovery. ks-driver needs the WDK; the job
#            locates it, then checks with dumpbin that the linked image imports
#            no ntdll.dll (the load failure documented in AGENTS.md).
#
# windows-2022 is pinned on purpose. It is the only x64 hosted image that ships
# the WDK kit: the image's own provisioning script refuses every other OS, and
# windows-latest (Server 2025) carries only the WDK Visual Studio extension, not
# the headers and kernel libraries. The locate step installs the kit itself when
# it is missing, so moving to another image later does not quietly drop
# ks-driver.sys from the artifacts.

name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Set to "false" only if a run must succeed without producing the native
  # driver image.
  REQUIRE_WDK: "true"
  # windows-2022 already has the kit; any other image gets it from wdksetup.
  INSTALL_WDK_IF_MISSING: "true"

jobs:
  verify:
    name: fmt / check / test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # The image is part of the key: object files built on one Windows image
      # must not be restored onto another.
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-win2022-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-win2022-cargo-target-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

  build:
    name: release images
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # The image is part of the key: object files built on one Windows image
      # must not be restored onto another.
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-win2022-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-win2022-cargo-target-

      - name: Build user-mode binaries
        run: cargo build --release -p ks-service -p ks-installer

      # The normal release profile is panic = "abort"; the GUI recovers runtime
      # panics at the frame and Lua callback boundaries, so it must be built
      # with the unwind-enabled profile.
      - name: Build ks-gui
        run: cargo build --profile gui-release -p ks-gui

      # The WDK is not always where the documented layout says: the kits root is
      # recorded in the registry, WDKContentRoot is set by a WDK developer
      # prompt, and both Program Files flavours exist across images. Ask all of
      # them before concluding anything, and print a full dump when it still
      # fails so one run explains the whole picture.
      - name: Locate WDK
        id: wdk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-KitsRoots {
            $roots = [System.Collections.Generic.List[string]]::new()
            foreach ($key in @(
              'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots')) {
              if (Test-Path $key) {
                $value = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).KitsRoot10
                if ($value) { $roots.Add($value) }
              }
            }
            if ($env:WDKContentRoot) { $roots.Add($env:WDKContentRoot) }
            $roots.Add("${env:ProgramFiles(x86)}\Windows Kits\10")
            $roots.Add("$env:ProgramFiles\Windows Kits\10")
            $roots | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          }

          function Find-Wdk {
            param([string[]] $Roots)
            foreach ($root in $Roots) {
              $includeRoot = Join-Path $root 'Include'
              if (-not (Test-Path $includeRoot)) { continue }
              $versions = Get-ChildItem $includeRoot -Directory |
                Where-Object {
                  $_.Name -match '^\d+(\.\d+){1,3}$' -and
                  (Test-Path (Join-Path $_.FullName 'km\ntddk.h'))
                } |
                Sort-Object { [version]$_.Name } -Descending |
                Select-Object -ExpandProperty Name
              # Prefer the version the repository documents as known good, then
              # the newest one that also has x64 kernel libraries.
              foreach ($version in @('10.0.26100.0') + ($versions | Where-Object { $_ -ne '10.0.26100.0' })) {
                $lib = Join-Path $root "Lib\$version\km\x64"
                if (Test-Path (Join-Path $lib 'ntoskrnl.lib')) {
                  return [pscustomobject]@{ Root = $root; Version = $version; Lib = $lib }
                }
              }
            }
            return $null
          }

          $wdk = Find-Wdk -Roots @(Get-KitsRoots)

          if (-not $wdk -and $env:INSTALL_WDK_IF_MISSING -ne 'false') {
            Write-Host 'No WDK kit found; installing it with wdksetup (same payload the windows-2022 image uses).'
            $setup = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2324617' -OutFile $setup
            $proc = Start-Process -FilePath $setup -ArgumentList '/features', '+', '/quiet' -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "wdksetup.exe failed with exit code $($proc.ExitCode)." }
            $wdk = Find-Wdk -Roots @(Get-KitsRoots)
          }

          if (-not $wdk) {
            Write-Host '--- diagnostics ---'
            foreach ($key in @(
              'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots')) {
              if (Test-Path $key) { Write-Host $key; Get-ItemProperty -Path $key | Out-String | Write-Host }
            }
            foreach ($root in Get-KitsRoots) {
              Write-Host "root: $root"
              foreach ($sub in @('Include', 'Lib')) {
                $path = Join-Path $root $sub
                if (Test-Path $path) {
                  Get-ChildItem $path -Directory | ForEach-Object { Write-Host "  $sub\$($_.Name)" }
                }
              }
            }
            Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"

            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            if ($env:REQUIRE_WDK -ne 'false') {
              throw 'No usable WDK found. See the diagnostics above.'
            }
            Write-Warning 'No usable WDK found; skipping the native driver image.'
            exit 0
          }

          "WDK_ROOT=$($wdk.Root)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WDK_LIB=$($wdk.Lib)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WDK_VERSION=$($wdk.Version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KS_DRIVER_WDK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using WDK $($wdk.Version) ($($wdk.Lib))"

      # build.rs emits the Native/Driver/entry-point linker flags only when
      # KS_DRIVER_WDK=1 is set, so this is the only step that produces the .sys.
      - name: Build ks-driver
        if: steps.wdk.outputs.found == 'true'
        run: cargo build --release -p ks-driver --features wdk --bin ks-driver

      # The driver is copied to the workspace root by its /OUT:ks-driver.sys link
      # argument, but keep the target-dir candidates so a build.rs change cannot
      # silently drop the artifact.
      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $images = [ordered]@{
            'ks-service.exe'   = 'target\release\ks-service.exe'
            'ks-installer.exe' = 'target\release\ks-installer.exe'
            'ks-gui.exe'       = 'target\gui-release\ks-gui.exe'
          }
          foreach ($entry in $images.GetEnumerator()) {
            if (-not (Test-Path $entry.Value)) { throw "Missing build output: $($entry.Value)" }
            Copy-Item $entry.Value (Join-Path dist $entry.Key) -Force
          }

          $driverCandidates = @(
            'ks-driver.sys',
            'target\release\ks-driver.sys',
            'target\x86_64-pc-windows-msvc\release\ks-driver.sys'
          )
          $driver = $driverCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($driver) {
            Copy-Item $driver 'dist\ks-driver.sys' -Force
            Write-Host "Driver image collected from $driver"
          } elseif ($env:KS_DRIVER_WDK -eq '1') {
            throw "ks-driver.sys was not produced. Checked: $($driverCandidates -join ', ')"
          }

          # The installer deploys driver and service from one flat directory.
          if (Test-Path 'dist\ks-driver.sys') {
            Copy-Item 'ks-driver\ks_driver.inf' 'dist\ks_driver.inf' -Force
          }

          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Inspect driver imports
        if: steps.wdk.outputs.found == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driverPath = 'dist\ks-driver.sys'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
            if ($vsPath) {
              $dumpbin = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
            }
          }
          if (-not $dumpbin) {
            $dumpbin = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $dumpbin) { throw 'dumpbin.exe not found; cannot inspect the driver image.' }

          $imports = & $dumpbin.FullName /nologo /imports $driverPath | Out-String
          $images = [regex]::Matches($imports, '(?im)^\s*([A-Za-z0-9_.\-]+\.(?:dll|sys|exe))\s*$') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique
          Write-Host "Imported images: $($images -join ', ')"

          # A kernel image cannot resolve ntdll.dll; this is how the removed
          # IOCTL_ALLOC_MEM builds failed to start (AGENTS.md known limitations).
          if ($images -match '^ntdll\.dll$') {
            throw 'ks-driver.sys imports ntdll.dll; the kernel loader will reject this image.'
          }

          & $dumpbin.FullName /nologo /headers $driverPath |
            Select-String -Pattern 'subsystem' |
            Select-Object -First 2 |
            ForEach-Object { Write-Host $_.Line.Trim() }

      - name: Write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
            } |
            Set-Content -Path 'dist\SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist\SHA256SUMS.txt' | Write-Host

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-script-release
          path: dist
          if-no-files-found: error
          retention-days: 30
