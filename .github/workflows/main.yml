# Windows-only workspace: ks-core is the no_std protocol/ABI crate, ks-driver is
# a WDM kernel driver, and the service/GUI/installer use Win32 APIs. There is no
# cross-platform build, so every job runs on a Windows runner.
#
# Two stages:
#   verify - the AGENTS.md checklist (fmt / check / test). No WDK needed.
#   build  - deployment images. ks-gui uses the gui-release profile because the
#            normal release profile is panic = "abort", which would break the
#            GUI's catch_unwind recovery. ks-driver needs the WDK; the job
#            locates it, then checks with dumpbin that the linked image imports
#            no ntdll.dll (the load failure documented in AGENTS.md).

name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # windows-latest images ship the WDK. Set this to "false" only if a run must
  # succeed without producing the native driver image.
  REQUIRE_WDK: "true"

jobs:
  verify:
    name: fmt / check / test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-target-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

  build:
    name: release images
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-target-

      - name: Build user-mode binaries
        run: cargo build --release -p ks-service -p ks-installer

      # The normal release profile is panic = "abort"; the GUI recovers runtime
      # panics at the frame and Lua callback boundaries, so it must be built
      # with the unwind-enabled profile.
      - name: Build ks-gui
        run: cargo build --profile gui-release -p ks-gui

      # The image's WDK lives at C:\Program Files (x86)\Windows Kits\10. Pick the
      # documented known-good version when present, otherwise the newest one that
      # has both kernel headers and x64 kernel libraries.
      - name: Locate WDK
        id: wdk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $found = $false

          if (Test-Path (Join-Path $kitsRoot 'Include')) {
            $versions = Get-ChildItem (Join-Path $kitsRoot 'Include') -Directory |
              Where-Object {
                $_.Name -match '^\d+(\.\d+){1,3}$' -and
                (Test-Path (Join-Path $_.FullName 'km\ntddk.h'))
              } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -ExpandProperty Name

            $ordered = @('10.0.26100.0') + ($versions | Where-Object { $_ -ne '10.0.26100.0' })

            foreach ($version in $ordered) {
              $lib = Join-Path $kitsRoot "Lib\$version\km\x64"
              if (-not (Test-Path (Join-Path $lib 'ntoskrnl.lib'))) { continue }

              "WDK_ROOT=$kitsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "WDK_LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "WDK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "KS_DRIVER_WDK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "Using WDK $version ($lib)"
              $found = $true
              break
            }
          }

          if (-not $found) {
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            if ($env:REQUIRE_WDK -ne 'false') {
              throw "No usable WDK found under '$kitsRoot' (need Include\<ver>\km\ntddk.h and Lib\<ver>\km\x64\ntoskrnl.lib)."
            }
            Write-Warning 'No usable WDK found; skipping the native driver image.'
          }

      # build.rs emits the Native/Driver/entry-point linker flags only when
      # KS_DRIVER_WDK=1 is set, so this is the only step that produces the .sys.
      - name: Build ks-driver
        if: steps.wdk.outputs.found == 'true'
        run: cargo build --release -p ks-driver --features wdk --bin ks-driver

      # The driver is copied to the workspace root by its /OUT:ks-driver.sys link
      # argument, but keep the target-dir candidates so a build.rs change cannot
      # silently drop the artifact.
      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $images = [ordered]@{
            'ks-service.exe'   = 'target\release\ks-service.exe'
            'ks-installer.exe' = 'target\release\ks-installer.exe'
            'ks-gui.exe'       = 'target\gui-release\ks-gui.exe'
          }
          foreach ($entry in $images.GetEnumerator()) {
            if (-not (Test-Path $entry.Value)) { throw "Missing build output: $($entry.Value)" }
            Copy-Item $entry.Value (Join-Path dist $entry.Key) -Force
          }

          $driverCandidates = @(
            'ks-driver.sys',
            'target\release\ks-driver.sys',
            'target\x86_64-pc-windows-msvc\release\ks-driver.sys'
          )
          $driver = $driverCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($driver) {
            Copy-Item $driver 'dist\ks-driver.sys' -Force
            Write-Host "Driver image collected from $driver"
          } elseif ($env:KS_DRIVER_WDK -eq '1') {
            throw "ks-driver.sys was not produced. Checked: $($driverCandidates -join ', ')"
          }

          # The installer deploys driver and service from one flat directory.
          if (Test-Path 'dist\ks-driver.sys') {
            Copy-Item 'ks-driver\ks_driver.inf' 'dist\ks_driver.inf' -Force
          }

          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Inspect driver imports
        if: steps.wdk.outputs.found == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driverPath = 'dist\ks-driver.sys'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
            if ($vsPath) {
              $dumpbin = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
            }
          }
          if (-not $dumpbin) {
            $dumpbin = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $dumpbin) { throw 'dumpbin.exe not found; cannot inspect the driver image.' }

          $imports = & $dumpbin.FullName /nologo /imports $driverPath | Out-String
          $images = [regex]::Matches($imports, '(?im)^\s*([A-Za-z0-9_.\-]+\.(?:dll|sys|exe))\s*$') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique
          Write-Host "Imported images: $($images -join ', ')"

          # A kernel image cannot resolve ntdll.dll; this is how the removed
          # IOCTL_ALLOC_MEM builds failed to start (AGENTS.md known limitations).
          if ($images -match '^ntdll\.dll$') {
            throw 'ks-driver.sys imports ntdll.dll; the kernel loader will reject this image.'
          }

          & $dumpbin.FullName /nologo /headers $driverPath |
            Select-String -Pattern 'subsystem' |
            Select-Object -First 2 |
            ForEach-Object { Write-Host $_.Line.Trim() }

      - name: Write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
            } |
            Set-Content -Path 'dist\SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist\SHA256SUMS.txt' | Write-Host

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-script-release
          path: dist
          if-no-files-found: error
          retention-days: 30
