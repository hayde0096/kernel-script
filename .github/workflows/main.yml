name: Build Kernel Script Driver

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4.2.0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install WDK
      run: choco install windows-wdk-10 -y

    - name: Set WDK paths
      run: |
        echo "WDK_ROOT=C:\Program Files (x86)\Windows Kits\10" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "WDK_LIB=C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\km\x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "WDK_VERSION=10.0.26100.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build ks-driver
      env:
        KS_DRIVER_WDK: 1
      run: cd ks-driver && cargo build --release --features wdk --bin ks-driver

    - name: Build ks-service
      run: cd ks-service && cargo build --release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4.4.0
      with:
        name: kernel-script-release
        path: target/release/ks-driver.sys
        retention-days: 30
